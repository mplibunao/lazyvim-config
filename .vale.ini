# `just prose` passes --no-global, so this file is authoritative and global styles are ignored.
# scripts/setup-vale.sh prepares this repo-local StylesPath for both local runs and CI.
StylesPath = styles
Packages = write-good, alex, https://github.com/tbhb/vale-ai-tells/releases/download/v1.11.0/ai-tells.zip

Vocab = Base, Nix, JVM, Go, TypeScript

# Commit messages are also linted through this section: scripts/commitmsg/main.go
# writes the message to a temp *.md file before invoking Vale, so [*.md] rules apply.
# There is no [COMMIT_EDITMSG] section and ai-tells-commits is not loaded here.
[*.md]
BasedOnStyles = Vale, ai-tells, write-good, alex

# Explicit error pins keep the gate independent from upstream default severities.
ai-tells.EmDashUsage = error
ai-tells.OverusedVocabulary = error
ai-tells.OverusedVocabularyVerbs = error

# E-Prime: too noisy for operational docs.
write-good.E-Prime = NO
# Spelling: tooling identifiers and plugin names dominate findings.
Vale.Spelling = NO
# Terms: flags proper nouns such as Delve.
Vale.Terms = NO
# Condescending: false positive on technical use of "simple".
alex.Condescending = NO
# Contrastive formulas: "X, not Y" states intentional scope boundaries.
ai-tells.ContrastiveFormulas = NO
# Formal register: "implementation" is core repo terminology.
ai-tells.FormalRegister = NO
