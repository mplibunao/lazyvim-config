name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    name: Gate (just ci)
    runs-on: ubuntu-latest
    env:
      MISE_FROZEN: "1"

    steps:
      - uses: actions/checkout@v5

      # Repo-local harness tools come from mise.toml + mise.lock.
      - name: Install mise tools
        uses: jdx/mise-action@v4
        with:
          version: 2026.3.17
          cache: true

      # Cache downloaded Vale style packages and the config-hash marker.
      # styles/config/vocabularies/ is tracked in the repo and must not be cached
      # (restoring it would overwrite the checked-out vocab with a stale snapshot).
      # just ci owns Vale setup via the prose: setup-vale dependency; no separate step needed.
      - name: Cache Vale style packages
        id: cache-vale
        uses: actions/cache@v5
        with:
          path: |
            styles/ai-tells
            styles/write-good
            styles/alex
            styles/.vale-config-hash
          # Key includes mise.lock for the Vale binary pin, plus Vale config, setup helper, and repo vocabulary.
          key: vale-styles-${{ runner.os }}-${{ hashFiles('mise.lock') }}-${{ hashFiles('.vale.ini', 'scripts/setup-vale.sh', 'styles/config/vocabularies/**') }}
          restore-keys: |
            vale-styles-${{ runner.os }}-${{ hashFiles('mise.lock') }}-
            vale-styles-${{ runner.os }}-

      # just nvim is excluded from CI (ADR-001).
      - name: Run CI gate
        run: just ci
